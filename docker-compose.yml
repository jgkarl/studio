# Optional local dev convenience: `docker compose up --build` (or `podman-compose up --build`).
# Not the primary VPS deployment path — see docs/deploy.md for the git-clone + prebuilt-binary +
# apt-installed-libvips approach that targets a plain VPS with no container runtime at all. This
# file is still useful for a quick local try without installing Go/libvips/templ yourself.
#
# SQLite is a single file — no separate database service needed at all anymore. Everything the
# app owns (the .db file + media-storage/) lives under one bind-mounted host directory so it's a
# plain directory you can back up or inspect directly, not an opaque named volume.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: localhost/studio-go:latest
    ports:
      - "3000:3000"
    environment:
      AUTH_SECRET: "${AUTH_SECRET:-dev-only-insecure-secret-change-me}"
      ALLOW_DEV_LOGIN: "${ALLOW_DEV_LOGIN:-true}"
    volumes:
      - ./data:/data
    restart: unless-stopped
