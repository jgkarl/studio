[defaults]
inventory = inventory.ini
roles_path = roles
host_key_checking = True
retry_files_enabled = False

# Points at a plain-text file (gitignored, chmod 600 - see README.md) holding the vault password,
# so every ansible-playbook run here just works without a separate --ask-vault-pass prompt. Unset
# this (or delete the file) to fall back to --ask-vault-pass on the command line instead.
vault_password_file = .vault-pass
