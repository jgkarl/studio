---
# Overridable in group_vars/all.yml - see all.yml.example for the ones you're expected to set.
studio_github_repo: "jgkarl/studio"
studio_release_asset_name: "studio-server-linux-amd64"
studio_release_version: "latest"

studio_system_user: studio
studio_home: /opt/app/studio
studio_port: 3000

# Blank disables Caddy install/config entirely - see all.yml.example.
studio_domain: ""

studio_seed_example_data: "false"
studio_app_url: ""
studio_bootstrap_admin_name: ""
studio_bootstrap_admin_email: ""
studio_bootstrap_admin_password: ""
studio_smtp_host: ""
studio_smtp_port: "587"
studio_smtp_user: ""
studio_smtp_pass: ""
studio_smtp_from: "studio@localhost"

# See internal/logging/internal/httplog. Bump studio_log_level to "debug" (via
# -e studio_log_level=debug + re-run update.yml/deploy.yml, or set it in all.yml for longer) while
# actively troubleshooting a live issue - every request still logs one line regardless of level.
studio_log_level: "info"
studio_log_format: "text"
# {{ studio_home }}/data/log/studio.log - a JSON copy of everything logged, rotated by
# /etc/logrotate.d/studio (see studio-logrotate.conf.j2) once it exceeds this size.
studio_log_rotate_size: "10M"
studio_log_rotate_count: 5
