---
# Overridable in group_vars/all.yml - see all.yml.example for the ones you're expected to set.
# stuudio_github_repo stays pointed at the jgkarl/studio-go GitHub repo on purpose — only the
# app/service identity was renamed to "stuudio", not the hosted repo itself.
stuudio_github_repo: "jgkarl/studio-go"
stuudio_release_asset_name: "stuudio-server-linux-amd64"
stuudio_release_version: "latest"

stuudio_system_user: stuudio
stuudio_home: /opt/stuudio
stuudio_port: 3000

# Blank disables Caddy install/config entirely - see all.yml.example.
stuudio_domain: ""

stuudio_seed_example_data: "false"
stuudio_app_url: ""
stuudio_bootstrap_admin_name: ""
stuudio_bootstrap_admin_email: ""
stuudio_bootstrap_admin_password: ""
stuudio_smtp_host: ""
stuudio_smtp_port: "587"
stuudio_smtp_user: ""
stuudio_smtp_pass: ""
stuudio_smtp_from: "stuudio@localhost"
