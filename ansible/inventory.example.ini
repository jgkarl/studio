# Copy to inventory.ini (gitignored) and fill in your own values. inventory.ini is never
# committed - it's the one file that actually names your server.
#
# ansible_user here needs to already have sudo on a fresh box (harden.yml uses it to create the
# dedicated "ansible" automation user in the first place) - typically root on a brand new VPS, or
# whatever admin account your provider set up. Make sure this same account is also listed in
# harden_extra_allowed_users (group_vars/all/all.yml), or harden.yml's AllowUsers change will lock
# it out on the very first run.
[studio]
studio-vps ansible_host=203.0.113.10 ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_ed25519
