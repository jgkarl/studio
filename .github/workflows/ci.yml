name: CI

# Test on every push and pull request. Release binaries are built separately, on version tags —
# see release.yml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Pinned, not "ubuntu-latest": this needs to stay the exact OS release.yml/docs/deploy.md
    # target (Ubuntu 24.04 "noble"), not silently drift to a future runner image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # govips (image processing) is CGO, needs libvips' headers to build/test - same package the
      # Dockerfile and docs/setup.md install for local dev.
      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvips-dev pkg-config

      # Installed as its own binary, same version pinned in the Dockerfile/release workflow, so
      # generated code is identical everywhere.
      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1020

      - name: Generate templates
        run: templ generate

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
